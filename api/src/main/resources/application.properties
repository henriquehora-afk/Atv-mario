spring.application.name=api

# Lê o arquivo .env (funciona rodando pela pasta api ou pela raiz do projeto)
spring.config.import=optional:file:.env[.properties],optional:file:api/.env[.properties]

# Banco de dados (PostgreSQL) - valores do .env
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:biblioteca}
spring.datasource.username=${DB_USERNAME:biblioteca}
spring.datasource.password=${DB_PASSWORD:biblioteca}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.pool-name=biblioteca-pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000

# Migrações (Flyway)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Autenticação e front-end
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-minutes=15
app.jwt.refresh-days=7
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cookie.secure=${COOKIE_SECURE:false}